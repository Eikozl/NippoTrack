name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run backend tests
        run: npm --prefix server test

      - name: Run client tests
        run: npm --prefix client test

      - name: Build frontend
        run: npm --prefix client run build

      - name: Weight budget (fail over 45MB / 8000 files in dist)
        run: |
          node -e "const fs=require('fs');let n=0,s=0;const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=d+'/'+e.name;if(e.isDirectory())walk(p);else{n++;s+=fs.statSync(p).size}}};walk('client/dist');console.log('dist files='+n+' bytes='+s);if(s>47185920||n>8000){console.error('WEIGHT BUDGET EXCEEDED');process.exit(1)}"

      - name: UI identity lint (informational, non-blocking)
        run: |
          matches=$(grep -rn -E "from-(indigo|blue|violet)-[0-9]+.*via-(purple|fuchsia)|via-purple.*to-pink|background-clip:text" client/src || true)
          if [ -n "$matches" ]; then echo "$matches"; else echo "ui-lint: no banned gradient/text-clip patterns"; fi

      - name: Audit runtime dependencies
        run: |
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

  multi-user-integration:
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      JLT_ALLOW_DESTRUCTIVE_INTEGRATION_TESTS: 'true'
      SUPABASE_INTEGRATION_URL: ${{ secrets.SUPABASE_INTEGRATION_URL }}
      SUPABASE_INTEGRATION_PROJECT_REF: ${{ secrets.SUPABASE_INTEGRATION_PROJECT_REF }}
      SUPABASE_INTEGRATION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_INTEGRATION_PUBLISHABLE_KEY }}
      SUPABASE_INTEGRATION_SECRET_KEY: ${{ secrets.SUPABASE_INTEGRATION_SECRET_KEY }}
      SUPABASE_AUTH_REDIRECT_URL: ${{ secrets.SUPABASE_AUTH_REDIRECT_URL }}
      POSTGRES_RUNTIME_HOST: ${{ secrets.POSTGRES_RUNTIME_HOST }}
      POSTGRES_RUNTIME_PORT: ${{ secrets.POSTGRES_RUNTIME_PORT }}
      POSTGRES_RUNTIME_USER: ${{ secrets.POSTGRES_RUNTIME_USER }}
      POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
      POSTGRES_RUNTIME_DB: ${{ secrets.POSTGRES_RUNTIME_DB }}
      POSTGRES_RUNTIME_SSL: verify-full
      POSTGRES_RUNTIME_SSL_CA: ${{ secrets.POSTGRES_RUNTIME_SSL_CA }}
      POSTGRES_RUNTIME_POOL_MAX: '2'
      POSTGRES_TIMEZONE: America/Santo_Domingo
    steps:
      - name: Determine Integration availability
        id: integration_gate
        shell: bash
        run: |
          required_variables=(
            SUPABASE_INTEGRATION_URL
            SUPABASE_INTEGRATION_PROJECT_REF
            SUPABASE_INTEGRATION_PUBLISHABLE_KEY
            SUPABASE_INTEGRATION_SECRET_KEY
            POSTGRES_RUNTIME_HOST
            POSTGRES_RUNTIME_PORT
            POSTGRES_RUNTIME_USER
            POSTGRES_RUNTIME_PASSWORD
            POSTGRES_RUNTIME_DB
            POSTGRES_RUNTIME_SSL_CA
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name}" ]; then
              echo "run_integration=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "run_integration=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.integration_gate.outputs.run_integration == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.integration_gate.outputs.run_integration == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        if: steps.integration_gate.outputs.run_integration == 'true'
        run: npm ci --prefix server

      - name: Run authentication flow harness
        if: steps.integration_gate.outputs.run_integration == 'true'
        run: npm --prefix server run postgres:test-auth-flows

      - name: Run two-user isolation harness
        if: steps.integration_gate.outputs.run_integration == 'true'
        run: npm --prefix server run postgres:test-multi-user-isolation

      - name: Run authenticated PostgreSQL runtime harness
        if: steps.integration_gate.outputs.run_integration == 'true'
        env:
          JLT_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm --prefix server run postgres:test-runtime

      - name: Report skipped integration harnesses
        if: steps.integration_gate.outputs.run_integration != 'true'
        run: echo "::warning::Integration skipped — no secrets"
