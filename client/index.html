<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F0E8" id="theme-color" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Organize what you learn, understand Japanese in context, and keep a clear view of your progress with NippoTrack." />
    <title>NippoTrack — Bring your Japanese learning together</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link data-nt-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560..680&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500..600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
    <link rel="preload" href="/videos/logo-draw-orange.mp4" as="video" type="video/mp4" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="landing-root"></div>
    <a href="#app-content" class="skip-link"><span data-i18n="Skip to main content">Skip to main content</span></a>
    <div id="auth-root"></div>
    <div id="app-shell" class="min-h-screen lg:grid lg:grid-cols-[17rem_1fr]" hidden>
      <div id="mobile-backdrop" class="fixed inset-0 z-30 hidden bg-ink/25 backdrop-blur-[1px] lg:hidden"></div>

      <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-68 -translate-x-full flex-col overflow-y-auto border-r border-stone bg-paper px-5 py-6 transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0">
        <div class="flex min-w-0 items-center justify-between gap-3 px-2">
          <span class="grid h-10 w-44 max-w-full shrink-0 place-items-center overflow-hidden">
            <img id="brand-logo" alt="NippoTrack" class="brand-logo" />
          </span>
          <button id="close-navigation" class="icon-button shrink-0 lg:hidden" type="button" aria-label="Close navigation"><span data-jlt-icon="close" aria-hidden="true"></span></button>
        </div>

        <nav class="mt-10 grid gap-1" aria-label="Primary navigation">
          <p class="nav-group-label" aria-hidden="true"><span data-i18n="Study">Study</span></p>
          <button class="nav-item is-active" type="button" data-page="dashboard"><span class="nav-icon" data-jlt-icon="dashboard" aria-hidden="true"></span><span data-i18n="Dashboard">Dashboard</span></button>
          <button class="nav-item" type="button" data-page="review"><span class="nav-icon" data-jlt-icon="review" aria-hidden="true"></span><span data-i18n="Review">Review</span></button>
          <button class="nav-item" type="button" data-page="sessions"><span class="nav-icon" data-jlt-icon="sessions" aria-hidden="true"></span><span data-i18n="Sessions">Sessions</span></button>
          <button class="nav-item" type="button" data-page="goals"><span class="nav-icon" data-jlt-icon="goals" aria-hidden="true"></span><span data-i18n="Goals">Goals</span></button>
          <p class="nav-group-label" aria-hidden="true"><span data-i18n="Library">Library</span></p>
          <button class="nav-item" type="button" data-page="vocabulary"><span class="nav-icon" data-jlt-icon="vocabulary" aria-hidden="true"></span><span data-i18n="Vocabulary">Vocabulary</span></button>
          <button class="nav-item" type="button" data-page="kanji"><span class="nav-icon" data-jlt-icon="kanji" aria-hidden="true"></span><span data-i18n="Kanji">Kanji</span></button>
          <button class="nav-item" type="button" data-page="grammar"><span class="nav-icon" data-jlt-icon="grammar" aria-hidden="true"></span><span data-i18n="Grammar">Grammar</span></button>
          <button class="nav-item" type="button" data-page="community"><span class="nav-icon" data-jlt-icon="community" aria-hidden="true"></span><span data-i18n="Community">Community</span></button>
          <button class="nav-item" type="button" data-page="notes"><span class="nav-icon" data-jlt-icon="notes" aria-hidden="true"></span><span data-i18n="Notes">Notes</span></button>
          <button class="nav-item" type="button" data-page="content"><span class="nav-icon" data-jlt-icon="content" aria-hidden="true"></span><span data-i18n="Content Log">Content Log</span></button>
          <p class="nav-group-label" aria-hidden="true"><span data-i18n="Tools">Tools</span></p>
          <button class="nav-item" type="button" data-page="analyzer"><span class="nav-icon" data-jlt-icon="analyzer" aria-hidden="true"></span><span data-i18n="Text Analyzer">Text Analyzer</span></button>
            <button class="nav-item" type="button" data-page="immersion"><span class="nav-icon" data-jlt-icon="immersion" aria-hidden="true"></span><span data-i18n="Immersion">Immersion</span></button>
            <button class="nav-item" type="button" data-page="reading"><span class="nav-icon" data-jlt-icon="reading" aria-hidden="true"></span><span data-i18n="Reading">Reading</span></button>
          <button class="nav-item" type="button" data-page="statistics"><span class="nav-icon" data-jlt-icon="statistics" aria-hidden="true"></span><span data-i18n="Statistics">Statistics</span></button>
          <p class="nav-group-label" aria-hidden="true"><span data-i18n="System">System</span></p>
        </nav>

        <div class="mt-6 shrink-0 rounded-[22px] border border-stone bg-paper p-4" aria-live="polite">
          <p class="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.16em] text-vermilion"><span class="streak-fire-icon" data-jlt-icon="streak" aria-hidden="true"></span><span data-i18n="Study Streak">Study Streak</span></p>
          <div id="sidebar-streak" class="mt-3">
            <p class="text-2xl font-semibold tracking-tight text-ink">—</p>
            <p class="mt-1 text-xs text-muted">Loading active days…</p>
          </div>
        </div>
      </aside>

      <div class="min-w-0">
        <header class="hidden h-20 items-center justify-between px-7 lg:flex lg:px-10">
          <div class="relative w-full max-w-xl">
            <label class="sr-only" for="global-search">Global search</label>
            <input id="global-search" class="field-control pr-12" type="search" autocomplete="off" placeholder="Search vocabulary, kanji, grammar, sessions, notes…" role="combobox" aria-expanded="false" aria-controls="global-search-results" aria-autocomplete="list" />
            <kbd class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded-md px-2 py-1 text-xs text-muted shadow-[var(--shadow-inset-sm)]">/</kbd>
            <div id="global-search-results" class="absolute inset-x-0 top-[calc(100%+.6rem)] z-30 hidden max-h-96 overflow-y-auto rounded-[18px] p-2" role="listbox" aria-label="Global search results" aria-live="polite"></div>
          </div>
          <div class="ml-5 flex shrink-0 gap-2">
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><span id="theme-toggle-icon" aria-hidden="true"></span></button>
            <div class="account-menu-anchor"><button id="account-button" class="icon-button" type="button" aria-label="Manage account" title="Manage account" aria-haspopup="menu" aria-expanded="false"><span data-jlt-icon="user" aria-hidden="true"></span></button></div>
          </div>
        </header>
        <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-stone bg-canvas/90 px-4 backdrop-blur-md sm:px-7 lg:hidden">
          <button id="open-navigation" class="icon-button" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><span data-jlt-icon="menu" aria-hidden="true"></span></button>
          <div class="flex gap-2">
            <button id="mobile-search-button" class="icon-button" type="button" aria-label="Open search" aria-expanded="false" aria-controls="mobile-search-bar"><span data-jlt-icon="search" aria-hidden="true"></span></button>
            <button id="mobile-theme-toggle" class="icon-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><span id="mobile-theme-toggle-icon" aria-hidden="true"></span></button>
            <div class="account-menu-anchor"><button id="mobile-account-button" class="icon-button" type="button" aria-label="Manage account" title="Manage account" aria-haspopup="menu" aria-expanded="false"><span data-jlt-icon="user" aria-hidden="true"></span></button></div>
          </div>
        </header>
        <div id="mobile-search-bar" class="border-b border-stone bg-canvas/95 px-4 pb-3 pt-1 lg:hidden" hidden>
          <label class="sr-only" for="mobile-search">Global search</label>
          <input id="mobile-search" class="field-control" type="search" autocomplete="off" placeholder="Search vocabulary, kanji, grammar, sessions, notes…" role="combobox" aria-expanded="false" aria-controls="mobile-search-results" aria-autocomplete="list" />
          <div id="mobile-search-results" class="mt-2 max-h-96 overflow-y-auto rounded-[18px] p-2 surface" role="listbox" aria-label="Global search results" aria-live="polite" hidden></div>
        </div>

        <main id="app-content" class="mx-auto min-h-screen max-w-[92rem] px-4 py-6 sm:px-6 sm:py-8 lg:px-8" tabindex="-1"></main>
      </div>
    </div>

    <div id="toast-region" class="pointer-events-none fixed bottom-5 right-5 z-50 grid w-[min(24rem,calc(100vw-2.5rem))] gap-3" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
