<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F0E8" />
  <title>NippoTrack — Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F5F0E8; color: #1c1917; display: grid; place-items: center; min-height: 100vh; }
    main { text-align: center; padding: 2rem; max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #57534e; line-height: 1.6; }
    a { color: inherit; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #1c1917; color: #f5f5f4; } p { color: #a8a29e; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>NippoTrack needs a connection to load your study data. Reconnect and <a href="/">try again</a>.</p>
  </main>
</body>
</html>
